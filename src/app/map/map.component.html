<div id="map-wrapper">
    <div id="map"></div>

    <app-toilet-panel
        [toilet] = "selectedToilet"
        (close) = "selectedToilet = null"
        (startRoute) = "startRoute()"
        (googleRoute) = "googleRoute()"
        (downloadGpx) = "downloadGpx()"
        (TransportModeChange) = "onTransportModeChange($event)"
        (startRouteFromCurrentLocation) = "startRouteFromCurrentLocation()">
    </app-toilet-panel>
</div>
